name: Sonarqube

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  build:
    name: Sonarqube
    runs-on: ubuntu-latest
    environment: SonarQube
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      # Instala o Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'  # ajuste para a versão do seu projeto

      # Baixa dependências do Flutter
      - name: Flutter pub get
        run: flutter pub get

      # Roda o SonarScanner
      - uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
